    <hr>
    <h3>Form Validation</h3>
    <form id="application_form" name="application_form" onsubmit="return validateForm()">
        <label for="fname_label">First Name:</label>
        <input type="text" name="fname" id="fname_label" placeholder="Write your first name"><br><br>
        <div class="error_input" id="error_input_fname">First name is not correct</div>

        <button>Submit Form</button>
    </form>
    <style>
        .error_input {
            color: red;
            display: none;
        }
    </style>
    <script>
        function validateForm() {
            const targetForm = document.forms["application_form"];

            const fnameEl = targetForm["fname"];
            var fNameValue = fnameEl.value;

            const fnameLabelEl = document.getElementById("fname_label");
            const errorInputFName = document.getElementById("error_input_fname");

            if (fNameValue == "") {
                /* fnameLabelEl.classList.add("error_input");
                alert("First name cannot empty!"); */
                errorInputFName.style.display = "block";
                fnameEl.style.borderColor = "red";
                return false;
            } else if (fNameValue.length <= 5 || fNameValue.length >= 9) {
                /* fnameLabelEl.classList.add("error_input");
                alert("Name must be between 5 and 9 character"); */
                errorInputFName.style.display = "block";
                fnameEl.style.borderColor = "red";
                return false
            }
            errorInputFName.style.display = "none";
            fnameEl.style.borderColor = "black";

            return true;
        }
    </script>
